# star-triage configuration. Edit, commit, done.
# The schedule lives in .github/workflows/star-triage.yml (GitHub requires it there).

# Who approves installs: manual (you approve every install), auto (Low-risk items install
# by themselves) or auto-plus (Low and Medium). High-risk and blocked items always wait for
# you. Change it with: python star-triage.py mode
mode: manual

# Whose stars to read. Leave empty to use the owner of this repository.
github_user: ""

# Repos to research per run (newest stars first). The rest wait for the next run.
# Each repo costs roughly one short research session, so start small.
max_per_run: 8

# Model for the triage step: sonnet (good and cheaper), opus (deeper), haiku (cheapest).
model: sonnet

# Reviewed plugins are listed in .claude-plugin/marketplace.json under this name. The
# star-triage plugin installs the approved ones. Scope: user (all projects), project or local.
marketplace_name: my-stars
install_scope: user

# star-triage auto and auto-plus modes only. An item installs by itself once its review is this many hours old (time
# to untick it or pause), and at most this many items install per day on one computer.
# Skip the wait for what is approved now: /star-triage:sync now (or python star-triage.py sync --now).
auto_wait_hours: 1
auto_daily_limit: 5

# Do you read the notes in Obsidian? With false, setup skips the Obsidian tips. Without
# Obsidian: python star-triage.py list (or /star-triage:list in Claude Code).
obsidian: true

# Keep the star-triage plugin up to date by itself: when your reviews come from a newer
# star-triage, it updates itself in the background (at most once a day). false turns it off.
auto_update: true

# Optional: your projects. Each name becomes a "relevant_to" label on notes. Add your own
# above General, each with a name and a one-line description, or leave just General.
# Reviews judge every repo on general quality and safety, and each note lists 2 or 3
# examples of when you'd use it. (An older `about_me:` key still works as extra context.)
contexts:
  - name: General
    description: Useful to know about, no specific project

# Allowed label values. The validator rejects notes that use anything else.
# Quote Yes/No: unquoted, YAML reads them as true/false.
labels:
  type: [Skill, Plugin, MCP server, Proxy / CLI, Library, Design system, Workflow pattern, App, Other]
  category: [Token saving, Code navigation, Docs lookup, Monitoring, Workflow, Orchestration,
             Video, Web scraping, Web automation, Security / RE, UI / Animation, Content, Other]
  status: [Inbox, Reviewing, Try next, Using, Later, Skipped]
  verdict: [Install, Try, When needed, Optional, Portfolio only, Not now, Skip]
  risk: [Low, Medium, High]
  saves_tokens: ["Yes", Partly, "No", Costs more]
  source: [GitHub star, Manual]

# Repos you starred but never want triaged (owner/name).
ignore: []
